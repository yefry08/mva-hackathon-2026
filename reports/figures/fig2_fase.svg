</style><title id="t">Tamano de los bloques de fase frente a la distancia entre las variantes</title><desc id="d">Histograma logaritmico de los bloques de fase del cromosoma 15. El mas largo mide 206 pb; las dos variantes de BUB1B estan a 10911 pb.</desc><rect class="bg" width="760" height="380" rx="8"/><text x="28.0" y="40.0" class="t ink" text-anchor="start">Por qué la fase no se puede resolver con estos datos</text><text x="28.0" y="62.0" class="st ink2" text-anchor="start">Tamaño de los 7.608 bloques de fase del cromosoma 15, en escala logarítmica.</text><line x1="70.0" y1="96" x2="70.0" y2="300" class="grid"/><text x="70.0" y="318.0" class="sm ink2" text-anchor="middle">1 pb</text><line x1="202.0" y1="96" x2="202.0" y2="300" class="grid"/><text x="202.0" y="318.0" class="sm ink2" text-anchor="middle">10 pb</text><line x1="334.0" y1="96" x2="334.0" y2="300" class="grid"/><text x="334.0" y="318.0" class="sm ink2" text-anchor="middle">100 pb</text><line x1="466.0" y1="96" x2="466.0" y2="300" class="grid"/><text x="466.0" y="318.0" class="sm ink2" text-anchor="middle">1 kb</text><line x1="598.0" y1="96" x2="598.0" y2="300" class="grid"/><text x="598.0" y="318.0" class="sm ink2" text-anchor="middle">10 kb</text><line x1="730.0" y1="96" x2="730.0" y2="300" class="grid"/><text x="730.0" y="318.0" class="sm ink2" text-anchor="middle">100 kb</text><line x1="70" y1="300" x2="730" y2="300" class="axis"/><rect x="71.0" y="126.0" width="9.0" height="174.0" rx="2" class="c1"/><rect x="104.0" y="182.3" width="9.0" height="117.7" rx="2" class="c1"/><rect x="126.0" y="211.8" width="9.0" height="88.2" rx="2" class="c1"/><rect x="148.0" y="217.3" width="9.0" height="82.7" rx="2" class="c1"/><rect x="159.0" y="228.4" width="9.0" height="71.6" rx="2" class="c1"/><rect x="170.0" y="223.3" width="9.0" height="76.7" rx="2" class="c1"/><rect x="181.0" y="165.7" width="9.0" height="134.3" rx="2" class="c1"/><rect x="192.0" y="229.0" width="9.0" height="71.0" rx="2" class="c1"/><rect x="