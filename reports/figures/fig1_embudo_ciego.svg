</style><title id="t">Embudo ciego del genoma completo a un gen</title><desc id="d">Siete etapas de filtrado, de 5.012.204 variantes a un unico gen, BUB1B, sin usar panel de genes ni ClinVar.</desc><rect class="bg" width="760" height="592" rx="8"/><text x="28.0" y="40.0" class="t ink" text-anchor="start">Del genoma completo a un gen, sin panel y sin ClinVar</text><text x="28.0" y="62.0" class="st ink2" text-anchor="start">El script no sabe nada de la enfermedad: busca el patrón recesivo en todo el genoma.</text><text x="28.0" y="88.0" class="sm ink2" text-anchor="start" letter-spacing="1">VARIANTES</text><line x1="96" y1="84" x2="732" y2="84" class="grid"/><text x="200.0" y="132.0" class="hero ink" text-anchor="end">5.012.204</text><text x="220.0" y="126.0" class="st ink" text-anchor="start">variantes en el VCF</text><text x="200.0" y="194.0" class="hero ink" text-anchor="end">23.041</text><text x="220.0" y="188.0" class="st ink" text-anchor="start">variantes en región codificante</text><text x="220.0" y="205.0" class="sm ink2" text-anchor="start">traducción local contra MANE Select</text><text x="28.0" y="234.0" class="sm ink2" text-anchor="start" letter-spacing="1">GENES</text><line x1="96" y1="230" x2="732" y2="230" class="grid"/><text x="200.0" y="278.0" class="hero ink" text-anchor="end">5.584</text><text x="220.0" y="272.0" class="st ink" text-anchor="start">genes con variantes no sinónimas</text><text x="200.0" y="340.0" class="hero ink" text-anchor="end">252</text><text x="220.0" y="334.0" class="st ink" text-anchor="start">genes con al menos una truncante</text><text x="220.0" y="351.0" class="sm ink2" text-anchor="start">nonsense o cambio de marco de lectura</text><text x="200.0" y="402.0" class="hero ink" text-anchor="end">8</text><text x="220.0" y="396.0" class="st ink" text-anchor="start">genes con patrón recesivo, todo raro</text><text x="220.0" y="413.0" class="sm ink2" text-anchor="start">gnomAD v4.1, frecuencia ≤ 0,001</text><text x="200.0" y="464.0" class="hero ink" text-anchor="end">3</text><text x="220.0" y="458.0" class="st ink" text-anchor="start">genes con truncante + missense</text><text x="220.0" y="475.0" class="sm ink2" text-anchor="start">SLC25A5, BUB1B, HLA-DRB1</text><rect x="28" y="492" width="704" height="52" rx="6" class="band"/><rect x="28" y="492" width="4" height="52" rx="2" class="c1"/><text x="200.0" y="526.0" class="hero ink" text-anchor="end">1</text><text x="220.0" y="520.0" class="st ink" text-anchor="start" font-weight="600">gen que se sostiene: BUB1B</text><text x="220.0" y="537.0" class="sm ink2" text-anchor="start">SLC25A5 está en el cromosoma X de un varón; HLA-DRB1, en la región HLA</text></svg>
