</style><title id="t">Paciente frente a genomas sanos de referencia</title><desc id="d">Cuatro metricas del pipeline para el paciente y 3 genomas de control.</desc><rect class="bg" width="900" height="420" rx="8"/><text x="28.0" y="40.0" class="t ink" text-anchor="start">El mismo pipeline sobre el paciente y sobre genomas sanos</text><text x="28.0" y="62.0" class="st ink2" text-anchor="start">Ni las variantes raras ni una rara codificante separan al paciente: lo hacen dos en un mismo gen y la patogenicidad conocida.</text><rect x="28" y="84" width="12" height="12" rx="3" class="c1"/><text x="46.0" y="94.0" class="lb ink" text-anchor="start">Paciente</text><rect x="130" y="84" width="12" height="12" rx="3" class="ctx"/><text x="148.0" y="94.0" class="lb ink" text-anchor="start">Genoma sano de referencia (GIAB), rotulado por nombre</text><text x="36.0" y="120.0" class="lb ink" text-anchor="start" font-weight="600">Variantes raras</text><text x="36.0" y="136.0" class="lb ink2" text-anchor="start">en el panel · no separa</text><line x1="36.0" y1="330" x2="223.0" y2="330" class="axis"/><rect x="40.0" y="192.0" width="28.8" height="138.0" rx="4" class="c1"/><text x="54.4" y="186.0" class="lb ink num" text-anchor="middle" font-weight="600">44</text><text x="54.4" y="346.0" class="sm ink2" text-anchor="middle">Paciente</text><rect x="86.8" y="188.8" width="28.8" height="141.2" rx="4" class="ctx"/><text x="101.1" y="182.8" class="lb ink num" text-anchor="middle">45</text><text x="101.1" y="346.0" class="sm ink2" text-anchor="middle">HG002</text><rect x="133.5" y="220.2" width="28.8" height="109.8" rx="4" class="ctx"/><text x="147.9" y="214.2" class="lb ink num" text-anchor="middle">35</text><text x="147.9" y="346.0" class="sm ink2" text-anchor="middle">HG001</text><rect x="180.2" y="170.0" width="28.8" height="160.0" rx="4" class="ctx"/><text x="194.6" y="164.0" class="lb ink num" text-anchor="middle">51</text><text x="194.6" y="346.0" class="sm ink2" text-anchor="middle">HG005</text><text x="247.0" y="120.0" class="lb ink" text-anchor="start" font-weight="600">Genes con una rara</text><text x="247.0" y="136.0" class="lb ink2" text-anchor="start">codificante · no separa</text><line x1="247.0" y1="330" x2="434.0" y2="330" class="axis"/><rect x="251.0" y="170.0" width="28.8" height="160.0" rx="4" class="c1"/><text x="265.4" y="164.0" class="lb ink num" text-anchor="middle" font-weight="600">2</text><text x="265.4" y="346.0" class="sm ink2" text-anchor="middle">Paciente</text><text x="312.1" y="324.0" class="lb ink num" text-anchor="middle">0</text><text x="312.1" y="346.0" class="sm ink2" text-anchor="middle">HG002</text><rect x="344.5" y="250.0" width="28.8" height="80.0" rx="4" class="ctx"/><text x="358.9" y="244.0" class="lb ink num" text-anchor="middle">1</text><text x="358.9" y="346.0" class="sm ink2" text-anchor="middle">HG001</text><rect x="391.2" y="170.0" width="28.8" height="160.0" rx="4" class="ctx"/><text x="405.6" y="164.0" class="lb ink num" text-anchor="middle">2</text><text x="405.6" y="346.0" class="sm ink2" text-anchor="middle">HG005</text><text x="458.0" y="120.0" class="lb ink" text-anchor="start" font-weight="600">Genes con dos raras</text><text x="458.0" y="136.0" class="lb ink2" text-anchor="start">codificantes · separa</text><line x1="458.0" y1="330" x2="645.0" y2="330" class="axis"/><rect x="462.0" y="170.0" width="28.8" height="160.0" rx="4" class="c1"/><text x="476.4" y="164.0" class="lb ink num" text-anchor="middle" font-weight="600">1</text><text x="476.4" y="346.0" class="sm ink2" text-anchor="middle">Paciente</text><text x="523.1" y="324.0" class="lb ink num" text-anchor="middle">0</text><text x="523.1" y="346.0" class="sm ink2" text-anchor="middle">HG002</text><text x="569.9" y="324.0" class="lb ink num" text-anchor="middle">0</text><text x="569.9" y="346.0" class="sm ink2" text-anchor="middle">HG001</text><text x="616.6" y="324.0" class="lb ink num" text-anchor="middle">0</text><text x="616.6" y="346.0" c